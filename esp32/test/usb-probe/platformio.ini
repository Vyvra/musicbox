; Independent USB host probe using ESP-IDF's own usb_host stack, not Arduino's TinyUSB wrapper.
;
; Two host stacks exist here and only one is known to be wired up: Arduino ships TinyUSB
; (prebuilt, so its debug logging cannot be enabled), while ESP-IDF has its own usb_host client
; API. If IDF sees a device attached and Arduino's TinyUSB does not, the problem is our host
; initialisation. If neither sees anything, the port is not delivering power or data.
[env:usbprobe]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2
    -std=gnu++17
