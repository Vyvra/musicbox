; Minimal board check: serial + WS2812, nothing else.
;
; Purpose is to separate "our firmware has a bug" from "the board or the serial link is not
; doing what we think". No USB host, no audio, no storage.
[env:boardcheck]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
