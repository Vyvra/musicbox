; Speaker/amp check: drives the MAX98357A directly over I2S with a generated tone.
;
; Deliberately independent of the audioI2S library and of the USB stick, so a failure here means
; wiring, amp or speaker - and a success means all three are good.
[env:speakercheck]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
