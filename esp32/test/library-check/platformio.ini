; Audio library check: play an MP3 from flash through ESP32-audioI2S.
;
; This exercises the last untested link in the audio path - the decoder and the library's own I2S
; setup - without involving the USB port. The partition table (default_16MB.csv) has a 3.5 MB
; SPIFFS partition at 0xc90000, so `pio run -t uploadfs` puts data/test.mp3 on the board.
[env:librarycheck]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; SPIFFS image built from data/ and uploaded with -t uploadfs
board_build.filesystem = spiffs
board_build.data_dir = data

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

extra_scripts = pre:../../scripts/patch_audio_lib.py

lib_deps =
    ; same pinned version as the real firmware
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
