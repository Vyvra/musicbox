; Pure ESP-IDF experiment: can ESP-IDF's usb_host + Espressif's MSC driver enumerate and read the
; stick on this board when the Arduino USB stack is not part of the image?
;
; TinyUSB (Arduino) enumerates this stick reliably; IDF's host kept the bus empty in the Arduino
; build, which suggested the two stacks contend for the USB peripheral. This answers that directly.
[env:idfmsc]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
