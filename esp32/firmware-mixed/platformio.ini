; Scratch feasibility project: our Arduino music-box firmware + cspot in ONE IDF image.
;
; framework = arduino, espidf  => PlatformIO builds a real ESP-IDF project and pulls the
; Arduino core in as an IDF component (arduino-esp32 3.3.12 = IDF 5.5.x on platform 8.0.0).
; cspot is NOT turned into an IDF component: its CMakeLists is a plain CMake build, so the
; project component add_subdirectory()s it exactly like cspot's own targets/esp32/main does.

[platformio]
default_envs = mixed

[env:mixed]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200

; N16R8: QIO flash + OCTAL PSRAM. In IDF mode these must also be set in sdkconfig.defaults
; (CONFIG_SPIRAM_MODE_OCT / CONFIG_ESPTOOLPY_FLASHSIZE_16MB); the board keys keep PIO's
; upload/flash logic and the memory_type sanity checks happy.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; bell vendors nanopb 0.4.6, which needs protobuf-3.x Python; the host protoc 36 would emit
; code it cannot import. Pin protoc 23.4 from .tools/ (see scripts/nanopb_env.py).
board_build.cmake_extra_args =
    -DPROTOBUF_PROTOC_EXECUTABLE=${PROJECT_DIR}/.tools/protoc/bin/protoc

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

extra_scripts = pre:scripts/patch_audio_lib.py
    pre:scripts/nanopb_env.py

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
