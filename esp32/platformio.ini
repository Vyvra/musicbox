; Dry-run port of the music box to ESP32-S3.
;
; Board: ESP32-S3-WROOM-1 **N16R8** dev board (16 MB flash, 8 MB *octal* PSRAM), dual
; USB-C: one CH343 UART port ("COM") and one native USB-OTG port.
;
; That port layout is exactly what the music box needs, and it dictates the flags below:
;   * native USB  = USB **host**, where the stick goes
;   * CH343 port  = power, flashing and serial logs
; so USB-CDC-on-boot must stay OFF - if the core claims the native port as a serial
; device, it cannot also act as a host.
;
; See README.md for what is real, what is stubbed and why.
[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1        ; generic S3; the N16R8 specifics are set below
framework = arduino
monitor_speed = 115200

; N16R8 = QIO flash + OP **I** PSRAM. Getting this wrong is the classic N16R8 footgun:
; the board boots but the 8 MB of PSRAM is invisible (or it boot-loops), and the audio
; decoder needs that headroom.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; use the S3's internal USB PHY
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

extra_scripts = pre:scripts/patch_audio_lib.py
lib_deps =
    ; MP3/AAC/FLAC/OGG decoder + I2S output. This is the piece that makes local
    ; playback practical on ESP32: there is no OS and no mpv to lean on.
    ; Pinned to 3.4.7: 4.0.0 fails to link on this toolchain (see the patch script).
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
