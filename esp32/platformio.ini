; Dry-run port of the music box to ESP32-S3.
;
; This is a feasibility sketch, not the shipping firmware: it mirrors the Pi daemon's
; behaviour (musicbox.txt, natural-order scanning, per-stick resume, per-stick volume,
; media-key controls) so the idea can be judged before any hardware is bought.
;
; See README.md for what is real, what is stubbed and why.
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; 8 MB flash + 8 MB PSRAM on the XIAO ESP32S3; the decoder needs the PSRAM headroom.
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
extra_scripts = pre:scripts/patch_audio_lib.py
lib_deps =
    ; MP3/AAC/FLAC/OGG decoder + I2S output. This is the piece that makes local
    ; playback practical on ESP32: there is no OS and no mpv to lean on.
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
